name: Actualizar competiciones FCA

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet -- data cal; then echo "Sin cambios"; exit 0; fi
          git config user.name "agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cal
          git commit -m "Actualizar datos FCA $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
