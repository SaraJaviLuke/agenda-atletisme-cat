<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda Atletisme CAT · Sub18 · Sub20 · Sub23 · Absolut</title>
  <meta name="description" content="Competicions de la Federació Catalana d'Atletisme per a Sub18, Sub20, Sub23 i Absolut, amb avís dels horaris publicats.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Agenda Atletisme <span>CAT</span></h1>
        <p class="sub">Sub18 · Sub20 · Sub23 · Absolut<span id="updated"></span></p>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="agenda" aria-selected="true">Agenda</button>
        <button role="tab" data-tab="news" aria-selected="false">Novetats<span id="newsBadge" class="badge" hidden></span></button>
        <button role="tab" data-tab="cal" aria-selected="false">Calendari</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filtres">
      <div class="row">
        <span class="lbl">Categoria</span>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="row">
        <span class="lbl">Modalitat</span>
        <div class="chips" id="modChips"></div>
      </div>
      <div class="row tools">
        <input id="q" type="search" placeholder="Cerca competició o lloc" autocomplete="off" aria-label="Cerca competició o lloc">
        <label class="toggle"><input type="checkbox" id="onlyHorari"> Només amb horari</label>
        <label class="toggle"><input type="checkbox" id="unknown"> Inclou sense categoria indicada</label>
      </div>
    </section>

    <section id="tab-agenda" class="tab"></section>
    <section id="tab-news" class="tab" hidden></section>
    <section id="tab-cal" class="tab" hidden></section>
  </main>

  <footer class="wrap foot">
    Dades obtingudes automàticament de <a href="https://fcatletisme.cat/calendari/" target="_blank" rel="noopener">fcatletisme.cat</a> cada hora.
    Web no oficial: confirma sempre la informació al web de la Federació.
  </footer>

  <script src="app.js"></script>
</body>
</html>
